<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex de Noa - Complet</title>

    <style>
        /* --- Le Style (CSS) --- */
        body { 
            font-family: sans-serif; 
            background: linear-gradient(to right, #cc0000, #ffcc00); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: white;
            padding-bottom: 50px; /* Pour éviter que le contenu ne touche le bas */
        }
        .header { 
            padding: 20px; 
            text-align: center; 
        }
        h1 { 
            margin-bottom: 5px; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        /* Affichage en Grille */
        .pokedex-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px;
            padding: 20px;
            max-width: 1200px; /* Augmentation de la largeur */
            width: 100%;
        }
        
        /* Style des Cartes de Pokémon */
        .pokemon-card {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        .pokemon-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* 💥 DISTINCTION LÉGENDAIRE 💥 */
        .pokemon-card.legendary {
            border: 3px solid gold;
            box-shadow: 0 0 15px gold;
            background: linear-gradient(135deg, #fff0c0, #ffe060);
        }

        /* Style pour le Mode Détail */
        .details {
            background: #fff;
            color: #333;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            display: none; 
            position: relative;
        }
        .details h2 { margin-top: 0; }

        /* Styles de la Modale de chargement */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            font-size: 1.5em;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        Chargement de tous les Pokémon... (Merci de patienter)
    </div>

    <div class="header">
        <h1>Pokédex de Noa</h1>
        <p>Liste complète des Pokémon existants et leurs détails.</p>
    </div>

    <div class="pokedex-list" id="pokedexList">
        </div>

    <div id="pokemonDetails" class="details">
        </div>

    <script>
        // L'URL pour récupérer TOUS les Pokémon (un grand nombre)
        const POKE_API_URL_ALL = 'https://pokeapi.co/api/v2/pokemon?limit=10000'; 
        
        // Traduction des Noms de Pokémon (Liste partielle)
        const TRADUCTIONS_FR = {
            'bulbasaur': 'Bulbizarre', 'ivysaur': 'Herbizarre', 'venusaur': 'Florizarre', 
            'charmander': 'Salamèche', 'charmeleon': 'Reptincel', 'charizard': 'Dracaufeu',
            'squirtle': 'Carapuce', 'wartortle': 'Carabaffe', 'blastoise': 'Tortank',
            'caterpie': 'Chenipan', 'mewtwo': 'Mewtwo', 'mew': 'Mew', 'lugia': 'Lugia' 
            // NOTE: Les autres noms s'afficheront en anglais (ex: 'Pikachu' est souvent le même)
        };
        
        // Traduction des Types (Liste partielle)
        const TYPES_TRADUCTION = {
            'normal': 'Normal', 'fire': 'Feu', 'water': 'Eau', 'grass': 'Plante', 'electric': 'Électrik',
            'ice': 'Glace', 'fighting': 'Combat', 'poison': 'Poison', 'ground': 'Sol', 'flying': 'Vol',
            'psychic': 'Psy', 'bug': 'Insecte', 'rock': 'Roche', 'ghost': 'Spectre', 'dragon': 'Dragon',
            'steel': 'Acier', 'dark': 'Ténèbres', 'fairy': 'Fée'
        };

        // Exécuter la fonction de chargement au démarrage
        document.addEventListener('DOMContentLoaded', chargerPokemons);

        /**
         * Charge la liste complète des Pokémon.
         */
        async function chargerPokemons() {
            try {
                // Requête pour tous les Pokémon
                const response = await fetch(POKE_API_URL_ALL);
                const data = await response.json();
                
                const listContainer = document.getElementById('pokedexList');
                
                // Filtrer les Pokémon qui ont un numéro de Pokédex valide (pour éviter les formes alternatives)
                const pokemonsFiltres = data.results.filter(p => {
                    const idMatch = p.url.match(/\/(\d+)\/$/);
                    return idMatch && parseInt(idMatch[1]) <= 1025; // Limite à la génération actuelle + quelques formes
                });

                // Créer la carte pour chaque Pokémon
                pokemonsFiltres.forEach(pokemon => {
                    creerCartePokemon(pokemon);
                });

                // Masquer l'écran de chargement après le traitement
                document.getElementById('loading-overlay').style.display = 'none';

            } catch (error) {
                console.error("Erreur lors du chargement des Pokémon :", error);
                document.getElementById('loading-overlay').innerHTML = 
                    '<p style="color:white; text-align:center;">Erreur de connexion à l\'API Pokémon.</p>';
            }
        }

        /**
         * Crée et ajoute un élément cliquable pour un Pokémon.
         */
        function creerCartePokemon(pokemon) {
            const container = document.getElementById('pokedexList');
            const card = document.createElement('div');
            card.className = 'pokemon-card';
            
            const nomOriginal = pokemon.name; 
            const nomFormatte = TRADUCTIONS_FR[nomOriginal] || 
                                (nomOriginal.charAt(0).toUpperCase() + nomOriginal.slice(1)).replace(/-/g, ' '); 
            
            card.textContent = nomFormatte;

            // Au clic, charge les détails de ce Pokémon
            card.onclick = () => chargerDetailsPokemon(pokemon.url, card);

            container.appendChild(card);
        }

        /**
         * Charge les détails (type, attaques, techniques, description, légendaire) d'un Pokémon.
         */
        async function chargerDetailsPokemon(url, cardElement) {
            const detailsContainer = document.getElementById('pokemonDetails');
            detailsContainer.style.display = 'block';
            detailsContainer.innerHTML = `<h2>Chargement de ${cardElement.textContent}...</h2>`;
            
            try {
                // Récupérer les détails de base
                const [response, speciesResponse] = await Promise.all([
                    fetch(url),
                    fetch(url.replace('/pokemon/', '/pokemon-species/')) // URL de l'espèce
                ]);
                
                const pokemonData = await response.json();
                const speciesData = await speciesResponse.json();
                
                // Vérification Légendaire
                if (speciesData.is_legendary || speciesData.is_mythical) {
                    cardElement.classList.add('legendary');
                } else {
                    cardElement.classList.remove('legendary'); // S'assurer que le style n'est pas appliqué par erreur
                }
                
                afficherDetails(pokemonData, speciesData);
                
            } catch (error) {
                console.error("Erreur lors du chargement des détails :", error);
                detailsContainer.innerHTML = '<h2>Erreur</h2><p>Désolé, impossible de charger les détails.</p>';
            }
        }
        
        /**
         * Affiche les détails complets du Pokémon.
         */
        function afficherDetails(pokemonData, speciesData) {
             const detailsContainer = document.getElementById('pokemonDetails');
             
             // Traduction des Types
             const types = pokemonData.types.map(typeInfo => {
                 const typeName = typeInfo.type.name;
                 return TYPES_TRADUCTION[typeName] || typeName.charAt(0).toUpperCase() + typeName.slice(1);
             }).join(' / ');
             
             // Attaques (4 premières, nettoyage du format)
             const attaques = pokemonData.moves.slice(0, 4).map(moveInfo => 
                 moveInfo.move.name.replace(/-/g, ' ').charAt(0).toUpperCase() + moveInfo.move.name.slice(1)
             ).join(', ');
             
             // Traduction du Nom
             const nomOriginal = pokemonData.name;
             const nom = TRADUCTIONS_FR[nomOriginal] || 
                         (nomOriginal.charAt(0).toUpperCase() + nomOriginal.slice(1)).replace(/-/g, ' ');
             
             // Récupérer la description en français
             const descriptionEntry = speciesData.flavor_text_entries.find(entry => 
                 entry.language.name === 'fr'
             );
             const description = descriptionEntry ? descriptionEntry.flavor_text.replace(/[\n\f]/g, ' ') : "Description non disponible en français.";

             const estLegendaire = speciesData.is_legendary ? ' (LÉGENDAIRE)' : speciesData.is_mythical ? ' (MYTHIQUE)' : '';
             
             // Code HTML des détails
             detailsContainer.innerHTML = `
                 <h2 style="color: ${estLegendaire ? 'gold' : '#333'};">${nom} ${estLegendaire}</h2>
                 <img src="${pokemonData.sprites.front_default}" alt="${nom}" style="width: 150px; height: 150px; float: right; margin-left: 10px;">
                 <p><strong>N° Pokédex :</strong> ${pokemonData.id}</p>
                 <p><strong>Types :</strong> ${types}</p>
                 <p style="clear: both;"><strong>Description :</strong> ${description}</p>
                 <p><strong>Attaques Principales (4 premières) :</strong> ${attaques}</p>
             `;
        }

    </script>
</body>
</html>
