<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex de Noa</title>

    <style>
        /* --- Le Style (CSS) --- */
        body { 
            font-family: sans-serif; 
            /* Dégradé Rouge et Jaune - Couleurs Pokémon */
            background: linear-gradient(to right, #cc0000, #ffcc00); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: white;
        }
        .header { 
            padding: 20px; 
            text-align: center; 
        }
        h1 { 
            margin-bottom: 5px; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* Ajout d'une ombre */
        }
        
        /* Affichage en Grille */
        .pokedex-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); /* Adaptatif */
            gap: 15px;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
        }
        
        /* Style des Cartes de Pokémon */
        .pokemon-card {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        .pokemon-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* Style pour le Mode Détail (à développer) */
        .details {
            background: #fff;
            color: #333;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            display: none; /* Caché par défaut */
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Pokédex de Noa</h1>
        <p>Liste des Pokémon originaux (Kanto) et leurs détails.</p>
    </div>

    <div class="pokedex-list" id="pokedexList">
        </div>

    <div id="pokemonDetails" class="details">
        </div>

    <script>
        // L'URL de l'API externe (PokeAPI)
        // Note: Nous utilisons async/await pour gérer les requêtes réseau (fetch)
        const POKE_API_URL = 'https://pokeapi.co/api/v2/pokemon?limit=151'; 

        // Exécuter la fonction de chargement au démarrage
        document.addEventListener('DOMContentLoaded', chargerPokemons);

        /**
         * Charge la liste des Pokémon depuis l'API.
         */
        async function chargerPokemons() {
            try {
                const response = await fetch(POKE_API_URL);
                const data = await response.json();
                
                // Crée une carte pour chaque Pokémon
                data.results.forEach(pokemon => {
                    creerCartePokemon(pokemon);
                });

            } catch (error) {
                console.error("Erreur lors du chargement des Pokémon :", error);
                document.getElementById('pokedexList').innerHTML = 
                    '<p style="color:white; text-align:center;">Erreur de connexion à l\'API Pokémon.</p>';
            }
        }

        /**
         * Crée et ajoute un élément cliquable pour un Pokémon.
         */
        function creerCartePokemon(pokemon) {
            const container = document.getElementById('pokedexList');
            const card = document.createElement('div');
            card.className = 'pokemon-card';
            
            // Formatage du nom (Majuscule)
            const nomFormatte = pokemon.name.charAt(0).toUpperCase() + pokemon.name.slice(1);
            card.textContent = nomFormatte;

            // Au clic, charge les détails de ce Pokémon
            card.onclick = () => chargerDetailsPokemon(pokemon.url);

            container.appendChild(card);
        }

        /**
         * Charge les détails (type, attaques, techniques) d'un Pokémon spécifique.
         * Cette fonction sera complétée à l'étape suivante.
         */
        async function chargerDetailsPokemon(url) {
            // Afficher un message de chargement temporaire
            const detailsContainer = document.getElementById('pokemonDetails');
            detailsContainer.style.display = 'block';
            detailsContainer.innerHTML = '<h2>Chargement...</h2>';
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Mettre à jour l'affichage avec les données (Types, Attaques...)
                afficherDetails(data);
                
            } catch (error) {
                console.error("Erreur lors du chargement des détails :", error);
                detailsContainer.innerHTML = '<h2>Erreur</h2><p>Désolé, impossible de charger les détails.</p>';
            }
        }
        
        /**
         * Affiche les détails (Types, Attaques) dans le conteneur.
         * Cette fonction sera complétée à l'étape suivante.
         */
        function afficherDetails(pokemonData) {
             const detailsContainer = document.getElementById('pokemonDetails');
             
             // Récupération des types (ex: Grass, Poison)
             const types = pokemonData.types.map(typeInfo => 
                 typeInfo.type.name.charAt(0).toUpperCase() + typeInfo.type.name.slice(1)
             ).join(', ');
             
             // Récupération de quelques attaques (4 premières)
             const attaques = pokemonData.moves.slice(0, 4).map(moveInfo => 
                 moveInfo.move.name.replace(/-/g, ' ').charAt(0).toUpperCase() + moveInfo.move.name.slice(1)
             ).join(', ');
             
             const nom = pokemonData.name.charAt(0).toUpperCase() + pokemonData.name.slice(1);
             
             // Code HTML des détails
             detailsContainer.innerHTML = `
                 <h2>${nom}</h2>
                 <p><strong>N° Pokédex :</strong> ${pokemonData.id}</p>
                 <p><strong>Types :</strong> ${types}</p>
                 <p><strong>Attaques Principales (4 premières) :</strong> ${attaques}</p>
                 <img src="${pokemonData.sprites.front_default}" alt="${nom}" style="width: 100px; height: 100px;">
             `;
        }

    </script>
</body>
</html>
